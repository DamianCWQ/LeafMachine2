leafmachine:
  archival_component_detector:
    detector_iteration: PREP_final
    detector_type: Archival_Detector
    detector_version: PREP_final
    detector_weights: best.pt
    do_save_prediction_overlay_images: true
    ignore_objects_for_overlay: []
    minimum_confidence_threshold: 0.5
    ruler_binary_detector: model_scripted_resnet_720_withCompression.pt
    ruler_detector: ruler_classifier_38classes_v-1.pt
  armature_component_detector:
    detector_iteration: ARM_A_1000
    detector_type: Armature_Detector
    detector_version: ARM_A_1000
    detector_weights: best.pt
    do_save_prediction_overlay_images: true
    ignore_objects_for_overlay: []
    minimum_confidence_threshold: 0.5
  cropped_components:
    binarize_labels: false
    binarize_labels_skeletonize: false
    do_save_cropped_annotations: false
    save_cropped_annotations:
    - label
    save_per_annotation_class: true
    save_per_image: false
  data:
    do_apply_conversion_factor: true
    include_darwin_core_data_from_combined_file: false
    save_individual_csv_files_landmarks: false
    save_individual_csv_files_measurements: false
    save_individual_csv_files_rulers: false
    save_individual_efd_files: false
    save_json_measurements: false
    save_json_rulers: false
  do:
    check_for_corrupt_images_make_vertical: true
    check_for_illegal_filenames: true
    run_leaf_processing: true
  landmark_detector:
    detector_iteration: Landmarks
    detector_type: Landmark_Detector_YOLO
    detector_version: Landmarks
    detector_weights: best.pt
    do_save_QC_images: false # set true to save images with detected landmarks drawn on them for quality control purposes. These images will be saved in a separate folder and can be used to visually inspect the performance of the landmark detector.
    do_save_final_images: false # set true to save images with final landmark detections drawn on them. These images will be saved in a separate folder and can be used for visual inspection of the final landmark detections after any post-processing steps.
    do_save_prediction_overlay_images: false # set true to save images with the predicted landmarks overlaid on the original image. These images will be saved in a separate folder and can be used to visually inspect the performance of the landmark detector and the quality of the predictions.
    do_show_QC_images: false
    do_show_final_images: false
    ignore_objects_for_overlay: []
    landmark_partial_leaves: false
    landmark_whole_leaves: true
    minimum_confidence_threshold: 0.02
    use_existing_landmark_detections: null
  landmark_detector_armature:
    detector_iteration: Landmarks_Arm_A_200
    detector_type: Landmark_Detector_YOLO
    detector_version: Landmarks_Arm_A_200
    detector_weights: last.pt
    do_save_QC_images: false # set true to save images with detected landmarks drawn on them for quality control purposes. These images will be saved in a separate folder and can be used to visually inspect the performance of the landmark detector.
    do_save_final_images: false # set true to save images with final landmark detections drawn on them. These images will be saved in a separate folder and can be used for visual inspection of the final landmark detections after any post-processing steps.
    do_save_prediction_overlay_images: false # set true to save images with the predicted landmarks overlaid on the original image. These images will be saved in a separate folder and can be used to visually inspect the performance of the landmark detector and the quality of the predictions.
    do_show_QC_images: true
    do_show_final_images: true
    ignore_objects_for_overlay: []
    minimum_confidence_threshold: 0.06
    upscale_factor: 10
    use_existing_landmark_detections: null
  leaf_segmentation:
    calculate_elliptic_fourier_descriptors: false
    detector_version: uniform_spaced_oriented_traces_mid15_pet5_clean_640_flipidx_pt2
    elliptic_fourier_descriptor_order: 40
    find_minimum_bounding_box: true
    generate_overlay: true
    keep_only_best_one_leaf_one_petiole: true
    minimum_confidence_threshold: 0.8
    overlay_background_color: black
    overlay_dpi: 300
    overlay_line_width: 1
    save_each_segmentation_overlay_image: true
    save_full_image_masks_color: true
    save_individual_overlay_images: true
    save_keypoint_overlay: false # Keypoints overlay
    save_masks_color: true
    save_oriented_images: false # Keypoints are currently not oriented, so this is set to false. If true, the leaf will be rotated to a standard orientation based on the keypoints before being saved.
    save_oriented_mask: false # Keypoints mask
    save_rgb_cropped_images: true
    save_individual_leaves_white_background: true
    save_segmentation_overlay_images_to_pdf: false
    save_simple_txt: false # Saves keypoints labels
    segment_partial_leaves: true
    segment_whole_leaves: true
    segmentation_model: Group3_Dataset_100000_Iter_1176PTS_512Batch_smooth_l1_LR00025_BGR
    use_efds_for_png_masks: false
  plant_component_segmentation:
    enable: true
    sam2_model_config: 'sam2\sam2_configs\sam2_hiera_l.yaml'
    sam2_checkpoint: 'models\sam2_hiera_large.pt'
    plantsam_checkpoint: 'models\BBS2_1024_2_epoch5.torch'
    segment_classes:
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    - 10
    segment_classes_include: []
    segment_classes_exclude:
    - 0
    - 1
    specialization_fallback_to_base: true
    minimum_detection_confidence: 0.35
    minimum_bbox_size_px: 20
    enable_contained_box_dedup: true
    dedup_within_class_only: true
    bbox_padding_px: 2
    bbox_padding_ratio: 0.01
    max_bbox_area_ratio: 0.75
    max_bbox_aspect_ratio: 12.0
    mask_postprocess_enable: true
    mask_cleanup_kernel_precision: 5
    mask_cleanup_kernel_recall: 3
    mask_min_component_area_ratio_precision: 0.01
    mask_min_component_area_ratio_recall: 0.003
    mask_fill_ratio_min: 0.003
    mask_fill_ratio_max: 0.98
    contour_simplify_epsilon_ratio: 0.003
    save_mask_png: false
    save_masked_rgb: true
    save_polygon_json: true
    save_overlay_images: false
    multimask_output: false
    cuda_sdpa_mode: math_only
    cuda_enable_cudnn_sdpa: false
    device: cuda
  logging:
    log_level: null
    suppress_library_info_logs: true
  modules:
    armature: false
    specimen_crop: false
  overlay:
    alpha_transparency_archival: 0.3
    alpha_transparency_plant: 0.0
    alpha_transparency_seg_plant_components: 0.35
    alpha_transparency_seg_partial_leaf: 0.3
    alpha_transparency_seg_whole_leaf: 0.4
    draw_plant_component_segmentation_bbox: true
    draw_plant_component_segmentation_labels: true
    draw_plant_component_segmentation_polygon: true
    ignore_archival_detections_classes: []
    ignore_landmark_classes: []
    ignore_plant_detections_classes:
    - leaf_whole
    line_width_archival: 2
    line_width_efd: 2
    line_width_plant: 2
    line_width_plant_component_segmentation: 2
    line_width_seg: 2
    overlay_background_color: black
    overlay_dpi: 300
    plant_component_segmentation_draw_order: after_leaf_masks
    save_overlay_to_jpgs: true
    save_overlay_to_pdf: false
    show_archival_detections: true
    show_landmarks: true
    show_plant_component_segmentations: true
    show_plant_detections: true
    show_segmentations: true
  plant_component_detector:
    detector_iteration: PLANT_LeafPriority
    detector_type: Plant_Detector
    detector_version: PLANT_LeafPriority
    detector_weights: LeafPriority.pt
    do_save_prediction_overlay_images: true
    ignore_objects_for_overlay: []
    minimum_confidence_threshold: 0.5
  print:
    optional_warnings: true
    verbose: true
  project:
    GBIF_mode: all
    accept_only_ideal_leaves: true # Can be set to false to include leaves with some damage, but may result in more noisy data. If true, only leaves with no damage and no occlusions will be included.
    batch_size: 50
    censor_archival_components: true
    device: cuda
    dir_images_local: D:\fyp_dataset\leaf_measurement_test
    dir_images_subset: ''
    dir_output: D:\fyp_dataset\outputs\leafmachine_test
    hide_archival_components:
    - ruler
    - barcode
    - label
    - colorcard
    - map
    - photo
    - weights
    image_location: local
    minimum_total_reproductive_counts: 0
    n_images_per_species: 10
    num_gpus: 1
    num_workers: 2
    num_workers_ruler: 2
    num_workers_seg: 2
    overlay_background_color: black
    overlay_dpi: 300
    path_combined_csv_local: null
    path_images_csv_local: null
    path_occurrence_csv_local: null
    process_subset_of_images: false
    replacement_color: '#FFFFFF'
    run_name: test_run
    species_list: ''
    use_CF_predictor: true
    use_existing_archival_component_detections: null
    use_existing_plant_component_detections: null
  ruler_detection:
    detect_ruler_type: true
    minimum_confidence_threshold: 0.5
    ruler_binary_detector: model_scripted_resnet_720_withCompression.pt
    ruler_detector: ruler_classifier_38classes_v-1.pt
    save_ruler_processed: false
    save_ruler_validation: false
    save_ruler_validation_summary: true
